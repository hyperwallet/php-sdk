name: PHP SDK CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - support/SDK-V3
      - feature/**
      - bugfix/**
      - dependabot/**

jobs:
  static-analysis:
    name: Static-analysis
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ 'ubuntu-latest' ]
        php-versions: [ '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@master

      #sets up the PHP version
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug

      #validate composer files
      - name: Validate composer.json and composer.lock
        run: composer validate

      #get dependencies
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      #get static analysis tool
      - name: Install static analysis tool
        run: |
          composer require --dev phpstan/phpstan 

      #evaluate the code
      - name: Run static analysis tool
        run: |
          vendor/bin/phpstan analyse -l 1 src/Hyperwallet tests

  tests:
    name: Tests
    needs: [static-analysis]
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@master

      #sets up the PHP version
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: |
          php --version
          ./vendor/bin/phpunit -v

  code-coverage:
    name: Report code coverage
    needs: [tests]
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ 'ubuntu-latest' ]
        php-versions: [ '8.1' ]

    steps:
      - uses: actions/checkout@master

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: |
          php --version
          ./vendor/bin/phpunit -v

      - name: Upload coverage results to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./vendor/bin/php-coveralls -v --exclude-no-stmt
