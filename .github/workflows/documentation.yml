name: Update Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  documentation:
    runs-on: ubuntu-latest
    name: Documentation

    strategy:
      matrix:
        operating-system:
          - ubuntu-latest
        php-versions:
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install \
          --prefer-dist \
          --no-progress \
          --no-interaction

      - name: Install ApiGen PHAR
        run: |
          mkdir -p tools
          curl --fail --location --retry 3 \
            https://github.com/ApiGen/ApiGen/releases/latest/download/apigen.phar \
            --output tools/apigen
          chmod +x tools/apigen

      - name: Generate Documentation
        run: |
          rm -rf docs
          tools/apigen src --output docs

      - name: Push documentation
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: gh-pages
          FOLDER: docs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Documentation updated"
